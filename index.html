<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Органайзер</title>
<script src="https://cdn.jsdelivr.net/npm/@sb/sb-js@2"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f5f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.hidden{display:none!important}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
#auth,#app{min-height:100vh}.wrap{width:min(760px,100%);margin:auto;padding:18px}
.auth-card,.top,.task,.modal-card{background:#fff;border:1px solid #e3e7ee;border-radius:18px;box-shadow:0 8px 28px #1118270d}
.auth-card{max-width:430px;margin:10vh auto;padding:28px}.logo{font-size:28px;font-weight:800;margin-bottom:8px}
.muted{color:#687386}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:650;font-size:14px}
input,textarea{width:100%;border:1px solid #d5dbe5;border-radius:12px;padding:12px 13px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:#667eea;box-shadow:0 0 0 3px #667eea18}textarea{min-height:90px;resize:vertical}
.password-wrap{position:relative}.password-wrap input{padding-right:48px}.password-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:9px;background:transparent;color:#687386;font-size:18px;padding:0}.password-eye:hover{background:#eef1f5}
.btn{border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#eef1f5;color:#172033}.danger{background:#fee2e2;color:#991b1b}
.auth-btn{width:100%;margin-top:8px}.remember{display:flex;align-items:center;gap:9px;margin:12px 0 2px;font-size:14px;color:#4b5563;cursor:pointer;user-select:none}.remember input{width:18px;height:18px;margin:0;accent-color:#111827}
.error{color:#b42318;font-size:14px;min-height:20px;margin-top:10px}
.top{padding:16px;margin-bottom:14px;position:sticky;top:10px;z-index:5}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:24px;font-weight:800}
.userline{font-size:13px;color:#687386;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1;min-width:140px}
.sorts{display:flex;gap:8px;margin-top:10px;overflow:auto;padding-bottom:2px}.sort{white-space:nowrap}
.sort.active{background:#dfe5ff;color:#273b9b}
.status{font-size:14px;color:#687386;margin:12px 2px}
.list{display:grid;gap:10px}.task{padding:15px}.task.done{opacity:.65}.task-head{display:flex;gap:12px;align-items:flex-start}
.check{width:23px;height:23px;flex:0 0 23px;margin-top:2px;accent-color:#111827}
.task-main{min-width:0;flex:1}.task-name{font-size:18px;font-weight:750;overflow-wrap:anywhere}.meta{font-size:14px;color:#687386;margin-top:3px}
.notes{white-space:pre-wrap;margin-top:10px;color:#394357;overflow-wrap:anywhere}.task-actions{display:flex;gap:7px;margin-top:12px}.task-actions .btn{padding:9px 11px;font-size:14px}
.empty{text-align:center;padding:38px 15px;color:#687386}
.modal{position:fixed;inset:0;background:#11182780;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal-card{width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-title{font-size:21px;font-weight:800}
.icon{background:#eef1f5;border-radius:10px;width:40px;height:40px;font-size:20px}
.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions .btn{flex:1}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modal-card{border-radius:20px}.wrap{padding-top:28px}}
@media(max-width:520px){.wrap{padding:10px}.top{top:6px}.title{font-size:22px}.actions .btn{min-width:0}.auth-card{margin:6vh 10px;padding:22px}}
</style>
</head>
<body>
<section id="auth">
  <div class="wrap">
    <div class="auth-card">
      <div class="logo">📋 Органайзер</div>
      <div class="muted">Личные задачи и ученики</div>
      <form id="loginForm">
        <div class="field"><label for="email">Логин</label><input id="email" type="text" autocomplete="username" required></div>
        <div class="field"><label for="password">Пароль</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="togglePassword" class="password-eye" type="button" aria-label="Показать пароль" title="Показать пароль">👁</button></div></div>
        <label class="remember"><input id="rememberMe" type="checkbox"> <span>Запомнить меня</span></label>
        <button class="btn primary auth-btn" type="submit">Войти</button>
      </form>
      <div id="authError" class="error"></div>
    </div>
  </div>
</section>

<section id="app" class="hidden">
  <div class="wrap">
    <header class="top">
      <div class="topline"><div><div class="title">Задачи</div><div id="userLine" class="userline"></div></div><button id="logoutBtn" class="btn secondary">Выйти</button></div>
      <div class="actions"><button id="addBtn" class="btn primary">＋ Добавить задачу</button></div>
      <div class="sorts">
        <button class="btn secondary sort active" data-sort="created">По добавлению</button>
        <button class="btn secondary sort" data-sort="student">По имени ученика</button>
        <button class="btn secondary sort" data-sort="class">По классу</button>
      </div>
    </header>
    <div id="status" class="status"></div>
    <main id="list" class="list"></main>
  </div>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><div id="modalTitle" class="modal-title">Новая задача</div><button id="closeModal" class="icon" type="button">×</button></div>
    <form id="taskForm">
      <input id="taskId" type="hidden">
      <div class="field"><label for="task">Задача</label><input id="task" required placeholder="Например: проверить контрольную"></div>
      <div class="field"><label for="student">Имя ученика</label><input id="student" placeholder="Имя и фамилия"></div>
      <div class="field"><label for="className">Класс</label><input id="className" placeholder="Например: 7А"></div>
      <div class="field"><label for="notes">Примечание</label><textarea id="notes" placeholder="Дополнительная информация"></textarea></div>
      <div class="modal-actions"><button class="btn secondary" id="cancelBtn" type="button">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div>
      <div id="formError" class="error"></div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lhfzvwlbnfvictowzvmp.sb.co';
const SUPABASE_KEY = 'sb_publishable_xnF9H_s77aMohEhxmBA_PQ_t8ggXhl0';
const sb = window.sb.createClient(SUPABASE_URL, SUPABASE_KEY);

const REMEMBER_KEY = 'mama_organizer_remember';
const LOGIN_KEY = 'mama_organizer_login';

let session = null, tasks = [], sortMode = 'created';

const $ = id => document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function show(id,on){$(id).classList.toggle('hidden',!on)}
function setStatus(s){$('status').textContent=s||''}

async function loadTasks(){
  if(!session)return;
  setStatus('Загрузка…');
  const {data,error}=await sb.from('tasks').select('*').order('created_at',{ascending:false});
  if(error){setStatus('Не удалось загрузить задачи: '+error.message);return}
  tasks=data||[];render();
}
function render(){
  let a=[...tasks];
  if(sortMode==='student')a.sort((x,y)=>(x.student_name||'').localeCompare(y.student_name||'','ru',{sensitivity:'base'})||new Date(y.created_at)-new Date(x.created_at));
  if(sortMode==='class')a.sort((x,y)=>(x.class_name||'').localeCompare(y.class_name||'','ru',{numeric:true,sensitivity:'base'})||new Date(y.created_at)-new Date(x.created_at));
  $('list').innerHTML=a.length?a.map(t=>`
    <article class="task ${t.completed?'done':''}">
      <div class="task-head">
        <input class="check" type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}',this.checked)" aria-label="Выполнено">
        <div class="task-main">
          <div class="task-name">${esc(t.task)}</div>
          ${t.student_name||t.class_name?'<div class="meta">'+esc(t.student_name)+(t.student_name&&t.class_name?' · ':'')+esc(t.class_name)+'</div>':''}
          ${t.notes?'<div class="notes">'+esc(t.notes)+'</div>':''}
          <div class="task-actions"><button class="btn secondary" onclick="editTask('${t.id}')">Изменить</button><button class="btn danger" onclick="deleteTask('${t.id}')">Удалить</button></div>
        </div>
      </div>
    </article>`).join(''):'<div class="empty">Задач пока нет.<br>Нажмите «＋ Добавить задачу».</div>';
  setStatus('Всего задач: '+tasks.length+(tasks.filter(t=>t.completed).length?' · выполнено: '+tasks.filter(t=>t.completed).length:''));
}
function openModal(t=null){
  $('taskId').value=t?.id||'';$('task').value=t?.task||'';$('student').value=t?.student_name||'';$('className').value=t?.class_name||'';$('notes').value=t?.notes||'';
  $('modalTitle').textContent=t?'Изменить задачу':'Новая задача';$('formError').textContent='';show('modal',true);setTimeout(()=>$('task').focus(),50);
}
function closeModal(){show('modal',false)}
async function saveTask(e){
  e.preventDefault();$('formError').textContent='';
  const payload={task:$('task').value.trim(),student_name:$('student').value.trim(),class_name:$('className').value.trim(),notes:$('notes').value.trim(),updated_at:new Date().toISOString()};
  if(!payload.task){$('formError').textContent='Введите задачу.';return}
  const id=$('taskId').value;
  const q=id?sb.from('tasks').update(payload).eq('id',id):sb.from('tasks').insert(payload);
  const {error}=await q;
  if(error){$('formError').textContent=error.message;return}
  closeModal();await loadTasks();
}
window.toggleTask=async(id,completed)=>{
  const {error}=await sb.from('tasks').update({completed,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){setStatus('Ошибка: '+error.message);return} const t=tasks.find(x=>x.id===id);if(t)t.completed=completed;render();
};
window.editTask=id=>{const t=tasks.find(x=>x.id===id);if(t)openModal(t)};
window.deleteTask=async id=>{
  const t=tasks.find(x=>x.id===id);if(!t)return;
  if(!confirm('Удалить эту задачу?'))return;
  const {error}=await sb.from('tasks').delete().eq('id',id);
  if(error){setStatus('Ошибка: '+error.message);return} await loadTasks();
};

$('email').value=localStorage.getItem(LOGIN_KEY)||'';
$('togglePassword').addEventListener('click',e=>{ e.preventDefault();
  const input=$('password'), btn=$('togglePassword');
  const visible=input.type==='text';
  input.type=visible?'password':'text';
  btn.textContent=visible?'👁':'🙈';
  btn.setAttribute('aria-label',visible?'Показать пароль':'Скрыть пароль');
  btn.title=visible?'Показать пароль':'Скрыть пароль';
});
$('rememberMe').checked=localStorage.getItem(REMEMBER_KEY)==='1';

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('authError').textContent='Вход…';
  const login=$('email').value.trim();
  const remember=$('rememberMe').checked;
  if(remember){
    localStorage.setItem(REMEMBER_KEY,'1');
    localStorage.setItem(LOGIN_KEY,login);
  }else{
    localStorage.removeItem(REMEMBER_KEY);
    localStorage.removeItem(LOGIN_KEY);
  }
  const {data,error}=await sb.auth.signInWithPassword({email:login,password:$('password').value});
  if(error){
    localStorage.removeItem(REMEMBER_KEY);
    localStorage.removeItem(LOGIN_KEY);
    $('authError').textContent=error.message;
    return;
  }
  session=data.session;show('auth',false);show('app',true);$('userLine').textContent=session.user.email||'';await loadTasks();
});
$('logoutBtn').onclick=async()=>{
  await sb.auth.signOut();
  localStorage.removeItem(REMEMBER_KEY);
  localStorage.removeItem(LOGIN_KEY);
  session=null;show('app',false);show('auth',true);
};
$('addBtn').onclick=()=>openModal();$('closeModal').onclick=closeModal;$('cancelBtn').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
$('taskForm').addEventListener('submit',saveTask);
document.querySelectorAll('.sort').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;document.querySelectorAll('.sort').forEach(x=>x.classList.toggle('active',x===b));render()});

sb.auth.onAuthStateChange((_event,s)=>{
  session=s;
  if(s){
    show('auth',false);show('app',true);
    $('userLine').textContent=s.user.email||'';
    loadTasks();
  }else{
    show('app',false);show('auth',true);
  }
});

(async()=>{
  const {data}=await sb.auth.getSession();
  session=data.session;
  if(session){
    if(localStorage.getItem(REMEMBER_KEY)==='1'){
      show('auth',false);show('app',true);$('userLine').textContent=session.user.email||'';await loadTasks();
    }else{
      await sb.auth.signOut();
    }
  }
})();
</script>
</body>
</html>
